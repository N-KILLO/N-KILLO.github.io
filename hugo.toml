baseURL = "https://n-killo.github.io/"
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
summaryLength = 40
timeZone = "Asia/Seoul"

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "N-KILLO"

[markup.goldmark.renderer]
  unsafe = false

[languages]
  [languages.ko]
    label = "한국어"
    locale = "ko-KR"
    title = "부산 로컬노트"
    weight = 1
    [languages.ko.params]
      description = "부산 사는 사람이 직접 정리하는 부산 축제·여행·생활 정보"
    [[languages.ko.menus.main]]
      name = "전체 글"
      pageRef = "/posts"
      weight = 1
    [[languages.ko.menus.main]]
      name = "소개"
      pageRef = "/about"
      weight = 2

  [languages.en]
    label = "English"
    locale = "en-US"
    title = "Busan Local Notes"
    weight = 2
    [languages.en.params]
      description = "Busan festivals, travel tips and local info, written by someone who lives here."
    [[languages.en.menus.main]]
      name = "All posts"
      pageRef = "/posts"
      weight = 1
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 2

  [languages.ja]
    label = "日本語"
    locale = "ja-JP"
    title = "釜山ローカルノート"
    weight = 3
    [languages.ja.params]
      description = "釜山在住者がまとめる、釜山のお祭り・旅行・現地情報"
    [[languages.ja.menus.main]]
      name = "記事一覧"
      pageRef = "/posts"
      weight = 1
    [[languages.ja.menus.main]]
      name = "このブログについて"
      pageRef = "/about"
      weight = 2

  [languages.zh-cn]
    label = "简体中文"
    locale = "zh-CN"
    title = "釜山本地笔记"
    weight = 4
    [languages.zh-cn.params]
      description = "釜山本地人整理的釜山节庆、旅游与当地生活信息"
    [[languages.zh-cn.menus.main]]
      name = "全部文章"
      pageRef = "/posts"
      weight = 1
    [[languages.zh-cn.menus.main]]
      name = "关于"
      pageRef = "/about"
      weight = 2

  [languages.zh-tw]
    label = "繁體中文"
    locale = "zh-TW"
    title = "釜山在地筆記"
    weight = 5
    [languages.zh-tw.params]
      description = "釜山在地人整理的釜山節慶、旅遊與在地生活資訊"
    [[languages.zh-tw.menus.main]]
      name = "全部文章"
      pageRef = "/posts"
      weight = 1
    [[languages.zh-tw.menus.main]]
      name = "關於"
      pageRef = "/about"
      weight = 2

  [languages.vi]
    label = "Tiếng Việt"
    locale = "vi-VN"
    title = "Ghi chú Busan"
    weight = 6
    [languages.vi.params]
      description = "Lễ hội, du lịch và thông tin địa phương Busan do người sống tại Busan tổng hợp"
    [[languages.vi.menus.main]]
      name = "Tất cả bài viết"
      pageRef = "/posts"
      weight = 1
    [[languages.vi.menus.main]]
      name = "Giới thiệu"
      pageRef = "/about"
      weight = 2

  [languages.th]
    label = "ไทย"
    locale = "th-TH"
    title = "บันทึกปูซานโดยคนท้องถิ่น"
    weight = 7
    [languages.th.params]
      description = "เทศกาล การท่องเที่ยว และข้อมูลท้องถิ่นของปูซาน เรียบเรียงโดยคนที่อาศัยอยู่ในปูซาน"
    [[languages.th.menus.main]]
      name = "บทความทั้งหมด"
      pageRef = "/posts"
      weight = 1
    [[languages.th.menus.main]]
      name = "เกี่ยวกับ"
      pageRef = "/about"
      weight = 2
