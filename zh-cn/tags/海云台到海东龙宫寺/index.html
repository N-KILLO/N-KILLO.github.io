<a href=/th/ hreflang=th>ไทย</a></div></header><main class=wrap><h1 class=page-title>海云台到海东龙宫寺</h1><section class=index><article class="entry reveal"><a href=/zh-cn/posts/haeundae-to-haedong-yonggungsa-bus/><div class=txt><p class=kicker><span>釜山交通</span><time datetime=2026-11-26>2026.11.26</time></p><h3>海云台去海东龙宫寺坐几路公交？</h3><p class=sub>181路到「龙宫寺入口」下车，20分钟一班，一文看懂</p><p class=dek>从海云台去海东龙宫寺，在地铁2号线海云台站坐181路公交，到「龙宫寺入口」下车再走过去就行，20分钟一班。从松亭海水浴场坐哪路车、从东海线奥西利亚站怎么坐139路和急行1001路、冬天最晚几点出发，这篇都简单整理好了。</p></div><img class=thumb src=/ko/posts/haeundae-to-haedong-yonggungsa-bus/yonggungsa-108-steps_hu_80523f12ccc80ab0.jpg alt width=200 height=150 loading=lazy decoding=async></a></article></section></main><footer class="wrap site-footer"><p class=foot-brand>釜山本地笔记</p><p>© 2026 釜山本地笔记</p><p class=hits><img src="https://hits.sh/n-killo.github.io.svg?view=today-total&amp;style=flat-square&amp;labelColor=%236c6a65&amp;color=%230b6e99&amp;label=%E4%BB%8A%E6%97%A5+%2F+%E6%80%BB%E6%B5%8F%E8%A7%88" alt="今日 / 总浏览" height=20 decoding=async referrerpolicy=no-referrer></p></footer><script src=/js/kinetic.min.4ba085d1288b1619ffe916c971dc15df7570d11b601bf0ac64d8ff1e70ce2a10.js integrity="sha256-S6CF0SiLFhn/6RbJcdwV33Vw0RtgG/CsZNj/HnDOKhA=" defer></script></body></html>
